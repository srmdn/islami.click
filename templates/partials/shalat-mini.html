{{define "shalat-mini"}}
<div
    role="region"
    aria-label="Waktu Shalat Hari Ini"
    x-data="{
        hh: '--', mm: '--', ss: '--',
        ch: 0, cm: 0, cs: 0,
        init() {
            const target = {{.NextPrayerUnix}} * 1000;
            const update = () => {
                const wib = new Date(Date.now() + (new Date().getTimezoneOffset() + 420) * 60000);
                this.hh = String(wib.getHours()).padStart(2,'0');
                this.mm = String(wib.getMinutes()).padStart(2,'0');
                this.ss = String(wib.getSeconds()).padStart(2,'0');
                const diff = Math.max(0, Math.floor((target - Date.now()) / 1000));
                this.ch = Math.floor(diff / 3600);
                this.cm = Math.floor((diff % 3600) / 60);
                this.cs = diff % 60;
            };
            update();
            setInterval(update, 1000);
        }
    }"
>
    {{if and (not .Error) .NextPrayerUnix}}
    <div class="mb-4 flex flex-col gap-1.5 px-1 text-sm text-stone-400 dark:text-stone-500 tabular-nums sm:flex-row sm:items-center sm:justify-between">
        <span class="font-mono text-stone-500 dark:text-stone-400" x-text="'Sekarang ' + hh+':'+mm+':'+ss + ' WIB'">Sekarang --:--:-- WIB</span>
        <span>
            <span class="text-stone-500 dark:text-stone-400">{{.NextPrayerName}}</span> dalam
            <span class="font-semibold text-stone-600 dark:text-stone-300">
            <template x-if="ch > 0">
                <span x-text="ch + ' jam'"></span>
            </template>
            <template x-if="ch > 0 || cm > 0">
                <span x-text="' ' + String(cm).padStart(2,'0') + ' menit'"></span>
            </template>
            <span x-text="' ' + String(cs).padStart(2,'0') + ' detik'"></span>
            </span>
        </span>
    </div>
    {{end}}

    <div class="rounded-[1.75rem] border border-[#E2D9CE] bg-white p-5 shadow-[0_20px_42px_-30px_rgba(35,55,61,0.7)] dark:border-[#1E4458] dark:bg-[#122E38] sm:p-6">
        <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold uppercase tracking-[0.14em] text-[#0E5C73] dark:text-[#83C0CC]">Waktu Shalat {{.City}}</span>
            <a href="/shalat" class="flex min-h-11 items-center gap-1 rounded-lg px-2 text-xs font-semibold text-stone-500 transition-colors hover:text-[#0E5C73] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 dark:text-stone-400 dark:hover:text-[#A9D7DE] arrow-slide">
                Lihat semua
                <svg class="w-3 h-3" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
            </a>
        </div>
        {{if .Error}}
        <p class="text-sm text-center text-stone-500 dark:text-stone-400 py-2">{{.Error}}</p>
        {{else}}
        <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
            {{range .Prayers}}
            <div class="min-w-0 rounded-xl px-1 py-3 text-center transition-all sm:px-2 {{if .IsNext}}bg-gradient-to-b from-[#0E5C73] to-[#0A4A5C] shadow-lg shadow-[#0E5C73]/20{{else}}bg-[#F1ECE4] dark:bg-[#102D37]{{end}} {{if .IsPast}}opacity-40 dark:opacity-60{{end}}">
                <div class="truncate text-[10px] font-semibold sm:text-[11px] {{if .IsNext}}text-white/70{{else}}text-stone-500 dark:text-stone-400{{end}}">{{.Name}}</div>
                <div class="mt-0.5 text-xs font-bold tabular-nums sm:text-sm {{if .IsNext}}text-white{{else}}text-stone-700 dark:text-stone-200{{end}}">{{.Time}}</div>
            </div>
            {{end}}
        </div>
        {{end}}
    </div>
</div>
{{end}}
