{{define "quran-ayahs"}}
{{range .Ayahs}}
<div class="group" id="ayah-{{.Number}}">
    <div class="min-w-0">
        <p class="font-arabic text-2xl leading-[2.4] text-[#1A2E35] dark:text-white mb-3" dir="rtl">{{.Arabic}} <span class="ayah-end">{{arabicDigits .Number}}</span></p>
        <p class="text-[15px] leading-relaxed text-[#5C7A84] dark:text-[#7AAAB5] mb-1">{{.Translation}}</p>
        <a href="/tafsir/{{$.Surah.Number}}?page={{$.Page}}#ayah-{{.Number}}" class="inline-flex items-center gap-1 min-h-[44px] py-2 pr-2 text-xs font-semibold text-[#0E5C73] dark:text-[#7AAAB5] hover:underline underline-offset-4">
            Baca tafsir
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
    </div>
</div>
{{end}}

{{if lt .Page .TotalPages}}
<button
    hx-get="/quran/{{.Surah.Number}}?page={{add .Page 1}}"
    hx-target="this"
    hx-swap="outerHTML"
    class="w-full py-3 border border-[#E2D9CE] dark:border-[#1E4458] rounded-xl text-[#5C7A84] dark:text-[#7AAAB5] hover:border-[#0E5C73] dark:hover:border-[#0E5C73] hover:text-[#0E5C73] dark:hover:text-[#7AAAB5] transition-colors font-medium text-sm"
>
    Muat ayat berikutnya
</button>
{{end}}
{{end}}
