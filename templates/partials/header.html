{{define "header"}}
<header class="sticky top-0 z-40 border-b border-[#E2D9CE]/80 dark:border-[#1E4458]/50" x-data="{ open: false, isDark: document.documentElement.classList.contains('dark') }" x-init="$watch('isDark', v => { document.documentElement.classList.toggle('dark', v); try { localStorage.setItem('theme', v ? 'dark' : 'light'); } catch (_) {} })" @keydown.escape.window="open = false">
    <div aria-hidden="true" class="absolute inset-0 bg-[#FAF7F2]/90 dark:bg-[#0C1E26]/90 backdrop-blur-xl" style="z-index: -1"></div>
    <nav aria-label="Navigasi utama" class="max-w-6xl mx-auto px-4 py-3.5 sm:px-6 sm:py-4 flex items-center justify-between">
        <a href="/" class="group flex items-center gap-3 rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 focus-visible:ring-offset-2 focus-visible:ring-offset-[#FAF7F2] dark:focus-visible:ring-offset-[#0C1E26]">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-[#0E5C73] to-[#083D4D] shadow-lg shadow-[#0E5C73]/25 sm:h-14 sm:w-14">
                <svg class="h-7 w-7 sm:h-8 sm:w-8" viewBox="0 0 48 48" fill="none">
                    <g transform="translate(24,24)">
                        <rect x="-11.5" y="-11.5" width="23" height="23" rx="2.8" fill="#FAF7F2"/>
                        <rect x="-11.5" y="-11.5" width="23" height="23" rx="2.8" fill="#FAF7F2" transform="rotate(45)"/>
                        <circle r="3.4" fill="#C9A84C"/>
                    </g>
                </svg>
            </div>
            <span class="text-xl font-bold tracking-tight text-[#1A2E35] transition-colors group-hover:text-[#0E5C73] dark:text-white sm:text-[1.35rem]">islami<span class="text-[#0E5C73] dark:text-[#83C0CC]">.click</span></span>
        </a>

        <div class="hidden items-center gap-1 rounded-2xl border border-[#E2D9CE]/80 bg-[#F1ECE4]/70 p-1 dark:border-[#1E4458]/80 dark:bg-[#102D37]/80 md:flex">
            <a href="/almatsurat" class="relative inline-flex min-h-11 items-center rounded-xl px-3.5 py-2 text-sm font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 {{if eq $.Meta.Path "/almatsurat"}}bg-white text-[#0E5C73] shadow-sm dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] hover:bg-white/80 hover:text-[#0E5C73] dark:text-[#D6C9B8] dark:hover:bg-[#143444] dark:hover:text-[#A9D7DE]{{end}}">Al-Ma'tsurat</a>
            <a href="/doa" class="relative inline-flex min-h-11 items-center rounded-xl px-3.5 py-2 text-sm font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 {{if eq $.Meta.Path "/doa"}}bg-white text-[#0E5C73] shadow-sm dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] hover:bg-white/80 hover:text-[#0E5C73] dark:text-[#D6C9B8] dark:hover:bg-[#143444] dark:hover:text-[#A9D7DE]{{end}}">Doa</a>
            <a href="/quran" class="relative inline-flex min-h-11 items-center rounded-xl px-3.5 py-2 text-sm font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 {{if hasPrefix $.Meta.Path "/quran"}}bg-white text-[#0E5C73] shadow-sm dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] hover:bg-white/80 hover:text-[#0E5C73] dark:text-[#D6C9B8] dark:hover:bg-[#143444] dark:hover:text-[#A9D7DE]{{end}}">Al-Qur'an</a>
            <a href="/shalat" class="relative inline-flex min-h-11 items-center rounded-xl px-3.5 py-2 text-sm font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 {{if eq $.Meta.Path "/shalat"}}bg-white text-[#0E5C73] shadow-sm dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] hover:bg-white/80 hover:text-[#0E5C73] dark:text-[#D6C9B8] dark:hover:bg-[#143444] dark:hover:text-[#A9D7DE]{{end}}">Shalat</a>
            <a href="/quiz" class="relative inline-flex min-h-11 items-center rounded-xl px-3.5 py-2 text-sm font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 {{if hasPrefix $.Meta.Path "/quiz"}}bg-white text-[#0E5C73] shadow-sm dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] hover:bg-white/80 hover:text-[#0E5C73] dark:text-[#D6C9B8] dark:hover:bg-[#143444] dark:hover:text-[#A9D7DE]{{end}}">Quiz</a>
            <button @click="isDark = !isDark" class="ml-1 flex h-11 w-11 cursor-pointer items-center justify-center rounded-xl bg-white/80 transition-colors hover:bg-[#0E5C73]/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 dark:bg-[#143444]" aria-label="Ganti tema warna">
                <svg class="w-4.5 h-4.5 text-[#5A4C40] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
                <svg class="w-4.5 h-4.5 text-[#D6C9B8] hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>

        <button
            @click="open = true"
            class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-2xl bg-[#F1ECE4] transition-colors hover:bg-[#0E5C73]/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 dark:bg-[#143444] md:hidden"
            aria-label="Buka menu"
            aria-controls="mobile-menu"
            :aria-expanded="open"
        >
            <svg class="w-5 h-5 text-[#5A4C40] dark:text-[#D6C9B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
        </button>
    </nav>

    <!-- Backdrop: fades in/out, click anywhere outside drawer to close -->
    <div
        x-cloak
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="open = false"
        class="md:hidden fixed inset-0 z-50 bg-[#0C1E26]/60 backdrop-blur-sm"
        aria-hidden="true"
    ></div>

    <!-- Drawer panel: slides in from left, full viewport height, above backdrop -->
    <div
        x-cloak
        x-show="open"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="-translate-x-full"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="-translate-x-full"
        id="mobile-menu"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mobile-menu-title"
        class="md:hidden fixed inset-y-0 left-0 z-60 w-80 bg-[#FAF7F2] dark:bg-[#0C1E26] shadow-2xl flex flex-col"
    >
        <div class="flex items-center justify-between px-4 py-3 border-b border-[#E2D9CE]/80 dark:border-[#1E4458]/50">
            <span id="mobile-menu-title" class="text-base font-bold text-[#1A2E35] dark:text-white">Menu</span>
            <button
                @click="open = false"
                class="flex h-11 w-11 items-center justify-center rounded-xl transition-colors hover:bg-[#F1ECE4] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#0E5C73]/50 dark:hover:bg-[#143444]"
                aria-label="Tutup menu"
            >
                <svg class="w-5 h-5 text-[#5A4C40] dark:text-[#D6C9B8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <nav class="flex-1 min-h-0 overflow-y-auto px-4 py-6 flex flex-col gap-2">
            <a href="/almatsurat" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/almatsurat"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                Al-Ma'tsurat
            </a>
            <a href="/doa" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/doa"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M8 6h8M6 10h12M8 14h8"/>
                        <rect x="4" y="3" width="16" height="18" rx="3"/>
                    </svg>
                </div>
                Doa
            </a>
            <a href="/quran" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if hasPrefix $.Meta.Path "/quran"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                Al-Qur'an
            </a>
            <a href="/asmaul-husna" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/asmaul-husna"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/>
                    </svg>
                </div>
                Asmaul Husna
            </a>
            <a href="/shalat" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/shalat"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/>
                        <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
                    </svg>
                </div>
                Jadwal Shalat
            </a>
            <a href="/kiblat" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/kiblat"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <circle cx="12" cy="12" r="10"/>
                        <polygon points="12,2 14,12 12,14 10,12" fill="currentColor" opacity="0.3" stroke="none"/>
                        <line x1="12" y1="2" x2="12" y2="14"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                </div>
                Arah Kiblat
            </a>
            <a href="/hisab" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if eq $.Meta.Path "/hisab"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                Hisab Hijriyah
            </a>
            <a href="/quiz" @click="open = false" class="flex items-center gap-4 px-4 py-4 rounded-2xl text-lg font-medium transition-all {{if hasPrefix $.Meta.Path "/quiz"}}bg-[#0E5C73]/10 text-[#0E5C73] dark:bg-[#143444] dark:text-[#A9D7DE]{{else}}text-[#5A4C40] dark:text-[#D6C9B8] hover:bg-[#0E5C73]/10 hover:text-[#0E5C73]{{end}}">
                <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-[#E6F4F8] dark:bg-[#123B47]">
                    <svg class="h-6 w-6 text-[#0E5C73] dark:text-[#83C0CC]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M9 9a3 3 0 1 1 6 0c0 1.5-1.5 2-2.5 3"/>
                        <circle cx="12" cy="18" r="0.5" fill="currentColor"/>
                        <circle cx="12" cy="12" r="10"/>
                    </svg>
                </div>
                Quiz Islami
            </a>
        </nav>

        <div class="px-4 py-4 border-t border-[#E2D9CE]/80 dark:border-[#1E4458]/50">
            <button
                @click="isDark = !isDark"
                class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-[#F1ECE4] dark:bg-[#143444] hover:bg-[#0E5C73]/10 transition-colors text-sm font-medium text-[#5A4C40] dark:text-[#D6C9B8]"
            >
                <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
                </svg>
                <svg class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <span x-text="isDark ? 'Light Mode' : 'Dark Mode'">Dark Mode</span>
            </button>
        </div>
    </div>
</header>
{{end}}
